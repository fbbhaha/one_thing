<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空人生</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column;
        }

        /* 顶部倒计时 */
        .top-bar {
            padding: 50px 20px 15px; text-align: center;
            background: linear-gradient(180deg, rgba(5,5,15,0.8) 0%, transparent 100%);
        }
        .top-bar h1 {
            font-size: 18px; color: #ffd700; letter-spacing: 4px; margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }
        .countdown-box {
            display: inline-flex; align-items: center; gap: 20px;
            background: rgba(10, 10, 30, 0.5); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 30px;
            padding: 10px 25px;
        }
        .countdown-box .num {
            font-size: 20px; font-weight: 700; color: #ffd700;
        }
        .countdown-box .lbl { font-size: 10px; color: rgba(255,255,255,0.4); }
        .countdown-box .sep { color: rgba(255,255,255,0.2); }
        .progress-bar {
            width: 200px; height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin: 10px auto 0; overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%; width: 31%;
            background: linear-gradient(90deg, #ffd700, #ff8c42);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }

        /* 中间区域：3D星空可见 */
        .middle { flex: 1; }

        /* 底部清单面板 */
        .list-panel {
            pointer-events: auto;
            background: linear-gradient(0deg, rgba(5,5,15,0.95) 30%, rgba(5,5,15,0.7) 80%, transparent 100%);
            padding: 20px 15px 15px;
            max-height: 55vh; overflow-y: auto;
        }
        .panel-title {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 15px; padding: 0 5px;
        }
        .panel-title .text { font-size: 13px; color: rgba(255,255,255,0.6); letter-spacing: 2px; }
        .panel-title .count { font-size: 11px; color: #ffd700; }

        .category {
            margin-bottom: 12px; background: rgba(255, 255, 255, 0.03);
            border-radius: 12px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .cat-header {
            display: flex; align-items: center; gap: 10px; padding: 12px 15px;
            cursor: pointer; transition: all 0.3s;
        }
        .cat-header:hover { background: rgba(255, 215, 0, 0.05); }
        .cat-icon { font-size: 18px; }
        .cat-name { font-size: 13px; color: rgba(255,255,255,0.85); flex: 1; }
        .cat-progress {
            display: flex; align-items: center; gap: 8px;
        }
        .cat-progress .stars { font-size: 10px; color: #ffd700; letter-spacing: 1px; }
        .cat-progress .ratio { font-size: 11px; color: rgba(255,255,255,0.4); min-width: 25px; text-align: right; }
        .cat-bar {
            height: 2px; background: rgba(255,255,255,0.08); margin-top: 8px;
            border-radius: 1px; overflow: hidden;
        }
        .cat-bar .fill {
            height: 100%; background: linear-gradient(90deg, #ffd700, #ff8c42);
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.4);
            transition: width 0.5s ease;
        }

        .cat-items {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
        }
        .category.expanded .cat-items { max-height: 500px; }
        .cat-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 15px 10px 40px; cursor: pointer;
            border-top: 1px solid rgba(255,255,255,0.03);
            transition: all 0.3s;
        }
        .cat-item:hover { background: rgba(255, 215, 0, 0.04); }
        .cat-item .star {
            font-size: 14px; width: 16px; text-align: center;
        }
        .cat-item .star.done { color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }
        .cat-item .star.undone { color: rgba(255,255,255,0.2); }
        .cat-item .event-name { font-size: 12px; color: rgba(255,255,255,0.7); flex: 1; }
        .cat-item .event-name.done { color: rgba(255,255,255,0.9); }
        .cat-item .event-date { font-size: 10px; color: rgba(255,255,255,0.3); }

        /* 底部操作栏 */
        .bottom-bar {
            display: flex; align-items: center; justify-content: center; gap: 30px;
            padding: 15px 20px 30px;
            background: rgba(5, 5, 15, 0.9); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: auto;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            cursor: pointer; transition: all 0.3s; opacity: 0.5;
        }
        .nav-btn.active { opacity: 1; }
        .nav-btn:hover { opacity: 1; }
        .nav-btn .icon { font-size: 18px; }
        .nav-btn .label { font-size: 9px; color: rgba(255,255,255,0.6); letter-spacing: 1px; }
        .nav-btn.active .label { color: #ffd700; }

        .add-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff8c42);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #000; cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transition: all 0.3s;
        }
        .add-btn:hover { transform: scale(1.1); }

        /* 事件详情弹窗 */
        .detail-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .detail-modal.active { display: flex; }
        .detail-content {
            background: rgba(15, 15, 35, 0.95); border-radius: 20px;
            padding: 30px 25px; width: 85%; max-width: 320px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            animation: fadeIn 0.3s ease; text-align: center;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } }
        .detail-content .star-big {
            font-size: 50px; margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
        }
        .detail-content .name { font-size: 20px; color: #fff; margin-bottom: 8px; }
        .detail-content .date { font-size: 13px; color: #ff8c42; margin-bottom: 15px; }
        .detail-content .desc {
            font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6;
            margin-bottom: 20px; text-align: left;
        }
        .detail-content .emotions {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 20px;
        }
        .detail-content .emotion {
            font-size: 20px; padding: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.05); cursor: pointer;
        }
        .detail-content .emotion.selected { background: rgba(255, 215, 0, 0.2); }
        .detail-content .btn-group { display: flex; gap: 10px; }
        .detail-content .btn {
            flex: 1; padding: 12px; border-radius: 10px; font-size: 13px;
            cursor: pointer; border: none; transition: all 0.3s;
        }
        .detail-content .btn-primary { background: linear-gradient(135deg, #ffd700, #ff8c42); color: #000; }
        .detail-content .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }

        /* 添加弹窗 */
        .add-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            z-index: 100; align-items: flex-end; justify-content: center;
        }
        .add-modal.active { display: flex; }
        .add-content {
            background: rgba(15, 15, 35, 0.98); border-radius: 20px 20px 0 0;
            padding: 25px 20px 30px; width: 100%; max-width: 420px;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } }
        .add-title { font-size: 16px; color: #ffd700; text-align: center; margin-bottom: 20px; }
        .add-form .form-group { margin-bottom: 15px; }
        .add-form .form-label { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 6px; display: block; }
        .add-form .form-input {
            width: 100%; padding: 12px; border-radius: 10px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 14px; outline: none;
        }
        .add-form .form-input:focus { border-color: #ffd700; }
        .add-form .categories { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .add-form .cat {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 10px 5px; border-radius: 10px;
            background: rgba(255,255,255,0.03); cursor: pointer;
            border: 1px solid transparent; transition: all 0.3s;
        }
        .add-form .cat:hover { background: rgba(255,215,0,0.1); }
        .add-form .cat.active { background: rgba(255,215,0,0.15); border-color: #ffd700; }
        .add-form .cat-icon { font-size: 20px; }
        .add-form .cat-name { font-size: 9px; color: rgba(255,255,255,0.4); }
        .add-form .cat.active .cat-name { color: #ffd700; }
        .add-form .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .add-form .btn {
            flex: 1; padding: 12px; border-radius: 10px; font-size: 13px;
            cursor: pointer; border: none; transition: all 0.3s;
        }
        .add-form .btn-primary { background: linear-gradient(135deg, #ffd700, #ff8c42); color: #000; }
        .add-form .btn-secondary { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }

        .hint {
            position: absolute; top: 50%; left: 0; right: 0; text-align: center;
            font-size: 10px; color: rgba(255,255,255,0.2);
            animation: pulse 3s infinite; pointer-events: none;
        }
        @keyframes pulse { 0%,100% { opacity: 0.2; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="overlay">
        <!-- 顶部倒计时 -->
        <div class="top-bar">
            <h1>✦ 星空人生 ✦</h1>
            <div class="countdown-box">
                <div>
                    <div class="num">9,125</div>
                    <div class="lbl">已穿越天数</div>
                </div>
                <div class="sep">·</div>
                <div>
                    <div class="num">19,655</div>
                    <div class="lbl">待探索天数</div>
                </div>
            </div>
            <div class="progress-bar"><div class="fill"></div></div>
        </div>

        <!-- 中间3D星空可见区域 -->
        <div class="middle">
            <div class="hint">✧ 拖拽旋转星空 · 点击星星查看 ✧</div>
        </div>

        <!-- 底部清单面板 -->
        <div class="list-panel" id="listPanel">
            <div class="panel-title">
                <span class="text">✧ 人生星图</span>
                <span class="count">5 / 24 已点亮</span>
            </div>
            <div id="categoryList"></div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-bar">
            <div class="nav-btn active" onclick="switchView('list', this)">
                <span class="icon">🌌</span>
                <span class="label">星图</span>
            </div>
            <div class="nav-btn" onclick="switchView('timeline', this)">
                <span class="icon">✨</span>
                <span class="label">往事</span>
            </div>
            <div class="add-btn" onclick="openAddModal()">✦</div>
            <div class="nav-btn" onclick="switchView('calendar', this)">
                <span class="icon">🌙</span>
                <span class="label">星历</span>
            </div>
            <div class="nav-btn" onclick="switchView('stats', this)">
                <span class="icon">✧</span>
                <span class="label">掠影</span>
            </div>
        </div>
    </div>

    <!-- 事件详情弹窗 -->
    <div class="detail-modal" id="detailModal">
        <div class="detail-content">
            <div class="star-big" id="detailStar">🎓</div>
            <div class="name" id="detailName">大学毕业</div>
            <div class="date" id="detailDate">2020-06-20</div>
            <div class="desc" id="detailDesc">在校园的最后一天，阳光洒在学士帽上，青春落幕，人生正式起航。</div>
            <div class="emotions">
                <span class="emotion selected">😊</span>
                <span class="emotion">🥰</span>
                <span class="emotion">😢</span>
                <span class="emotion">😌</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeDetail()">关闭</button>
                <button class="btn btn-primary">编辑</button>
            </div>
        </div>
    </div>

    <!-- 添加事件弹窗 -->
    <div class="add-modal" id="addModal">
        <div class="add-content">
            <div class="add-title">✦ 许下星愿</div>
            <div class="add-form">
                <div class="form-group">
                    <label class="form-label">选择星域</label>
                    <div class="categories">
                        <div class="cat" onclick="selectCat(this)"><span class="cat-icon">🎓</span><span class="cat-name">学业</span></div>
                        <div class="cat" onclick="selectCat(this)"><span class="cat-icon">💼</span><span class="cat-name">事业</span></div>
                        <div class="cat" onclick="selectCat(this)"><span class="cat-icon">❤️</span><span class="cat-name">情感</span></div>
                        <div class="cat" onclick="selectCat(this)"><span class="cat-icon">👨‍👩‍👧</span><span class="cat-name">家庭</span></div>
                        <div class="cat" onclick="selectCat(this)"><span class="cat-icon">✈️</span><span class="cat-name">旅行</span></div>
                        <div class="cat" onclick="selectCat(this)"><span class="cat-icon">🏥</span><span class="cat-name">健康</span></div>
                        <div class="cat" onclick="selectCat(this)"><span class="cat-icon">🎯</span><span class="cat-name">成长</span></div>
                        <div class="cat" onclick="selectCat(this)"><span class="cat-icon">💰</span><span class="cat-name">财务</span></div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">星愿名称</label>
                    <input type="text" class="form-input" placeholder="写下你的愿望...">
                </div>
                <div class="form-group">
                    <label class="form-label">发生日期</label>
                    <input type="date" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">星光备注</label>
                    <input type="text" class="form-input" placeholder="记录这一刻的感受...">
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                    <button class="btn btn-primary">✦ 点亮星辰</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ========== 数据 ==========
        const categories = [
            {
                name: '学业教育', icon: '🎓',
                items: [
                    { name: '入学', done: true, date: '2012-09', desc: '踏入大学校门，开启新篇章', emotion: '😊' },
                    { name: '毕业', done: true, date: '2020-06', desc: '在校园的最后一天，阳光洒在学士帽上，青春落幕', emotion: '😊' },
                    { name: '考研', done: false, date: '', desc: '', emotion: '' },
                    { name: '深造', done: false, date: '', desc: '', emotion: '' }
                ]
            },
            {
                name: '职业发展', icon: '💼',
                items: [
                    { name: '第一份工作', done: true, date: '2020-08', desc: '第一次穿上西装，紧张又兴奋', emotion: '😊' },
                    { name: '晋升', done: true, date: '2023-05', desc: '努力终于被看见，新的挑战开始', emotion: '😌' },
                    { name: '跳槽', done: false, date: '', desc: '', emotion: '' },
                    { name: '创业', done: false, date: '', desc: '', emotion: '' }
                ]
            },
            {
                name: '情感关系', icon: '❤️',
                items: [
                    { name: '遇见挚爱', done: true, date: '2021-03', desc: '在咖啡馆的偶然相遇，命运的红线悄然相连', emotion: '🥰' },
                    { name: '订婚', done: true, date: '2024-12', desc: '许下一生的承诺，从此不再是一个人', emotion: '🥰' },
                    { name: '结婚', done: false, date: '', desc: '', emotion: '' }
                ]
            },
            {
                name: '家庭生活', icon: '🏠',
                items: [
                    { name: '买房', done: false, date: '', desc: '', emotion: '' },
                    { name: '买车', done: false, date: '', desc: '', emotion: '' },
                    { name: '生子', done: false, date: '', desc: '', emotion: '' }
                ]
            },
            {
                name: '旅行冒险', icon: '✈️',
                items: [
                    { name: '第一次出国', done: true, date: '2024-12', desc: '在东京塔下许下新年愿望', emotion: '😊' },
                    { name: '自驾游', done: false, date: '', desc: '', emotion: '' },
                    { name: '环游世界', done: false, date: '', desc: '', emotion: '' }
                ]
            },
            {
                name: '个人成长', icon: '🎯',
                items: [
                    { name: '学会乐器', done: false, date: '', desc: '', emotion: '' },
                    { name: '阅读百书', done: false, date: '', desc: '', emotion: '' },
                    { name: '健身达标', done: false, date: '', desc: '', emotion: '' }
                ]
            }
        ];

        // ========== 渲染清单 ==========
        function renderList() {
            const html = categories.map((cat, ci) => {
                const done = cat.items.filter(i => i.done).length;
                const total = cat.items.length;
                const percent = (done / total * 100).toFixed(0);
                const stars = cat.items.map(i => i.done ? '✦' : '○').join('');

                const items = cat.items.map((item, ii) => `
                    <div class="cat-item" onclick="showDetail(${ci}, ${ii})">
                        <span class="star ${item.done ? 'done' : 'undone'}">${item.done ? '✦' : '○'}</span>
                        <span class="event-name ${item.done ? 'done' : ''}">${item.name}</span>
                        <span class="event-date">${item.date || '待点亮'}</span>
                    </div>
                `).join('');

                return `
                    <div class="category" onclick="toggleCategory(this, event)">
                        <div class="cat-header">
                            <span class="cat-icon">${cat.icon}</span>
                            <span class="cat-name">${cat.name}</span>
                            <div class="cat-progress">
                                <span class="stars">${stars}</span>
                                <span class="ratio">${done}/${total}</span>
                            </div>
                        </div>
                        <div class="cat-bar"><div class="fill" style="width: ${percent}%"></div></div>
                        <div class="cat-items">${items}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('categoryList').innerHTML = html;
        }

        function toggleCategory(el, e) {
            if (e.target.closest('.cat-item')) return;
            el.classList.toggle('expanded');
        }

        function showDetail(ci, ii) {
            const item = categories[ci].items[ii];
            document.getElementById('detailStar').textContent = categories[ci].icon;
            document.getElementById('detailName').textContent = item.name;
            document.getElementById('detailDate').textContent = item.date || '待点亮';
            document.getElementById('detailDesc').textContent = item.desc || '这个星愿还在等待被点亮...';
            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function openAddModal() { document.getElementById('addModal').classList.add('active'); }
        function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }
        function selectCat(el) {
            document.querySelectorAll('.add-form .cat').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function switchView(view, el) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        // ========== 3D 星空 ==========
        let scene, camera, renderer, stars = [], shootingStars = [];
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        let targetRot = { x: 0, y: 0 };
        let currentRot = { x: 0, y: 0 };
        let autoRotate = true;

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000011, 0.0006);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 500;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            createStarfield();
            createMilestoneStars();
            setupControls();
            window.addEventListener('resize', onResize);
            animate();
        }

        function createStarfield() {
            for (let i = 0; i < 3000; i++) {
                const geo = new THREE.SphereGeometry(0.3 + Math.random() * 0.4, 6, 6);
                const mat = new THREE.MeshBasicMaterial({
                    color: 0xffffff, transparent: true,
                    opacity: 0.3 + Math.random() * 0.4
                });
                const star = new THREE.Mesh(geo, mat);
                const r = 400 + Math.random() * 600;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                star.position.set(
                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.sin(phi) * Math.sin(theta),
                    r * Math.cos(phi)
                );
                star.userData = {
                    baseOpacity: mat.opacity,
                    speed: Math.random() * 0.02 + 0.01,
                    offset: Math.random() * Math.PI * 2
                };
                stars.push(star);
                scene.add(star);
            }
        }

        function createMilestoneStars() {
            // 为每个已完成的事件创建一颗发光星星
            const allDone = [];
            categories.forEach(cat => {
                cat.items.forEach(item => {
                    if (item.done) allDone.push({ item, cat });
                });
            });

            allDone.forEach((m, i) => {
                const group = new THREE.Group();
                const angle = (i / allDone.length) * Math.PI * 2;
                const radius = 180;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius * 0.6;
                const z = (Math.random() - 0.5) * 100;

                // 核心
                const core = new THREE.Mesh(
                    new THREE.SphereGeometry(8, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                group.add(core);

                // 内光晕
                const glow1 = new THREE.Mesh(
                    new THREE.SphereGeometry(15, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.25 })
                );
                group.add(glow1);

                // 外光晕
                const glow2 = new THREE.Mesh(
                    new THREE.SphereGeometry(28, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xff8c42, transparent: true, opacity: 0.1 })
                );
                group.add(glow2);

                // 旋转光环
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(22, 24, 32),
                    new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
                );
                ring.rotation.x = Math.PI / 2;
                group.add(ring);

                group.position.set(x, y, z);
                group.userData = { isMilestone: true, baseY: y, ring: ring };
                stars.push(group);
                scene.add(group);
            });
        }

        function setupControls() {
            const cvs = renderer.domElement;
            const onStart = (x, y) => { isDragging = true; autoRotate = false; prevMouse = { x, y }; };
            const onMove = (x, y) => {
                if (!isDragging) return;
                targetRot.y += (x - prevMouse.x) * 0.005;
                targetRot.x += (y - prevMouse.y) * 0.005;
                targetRot.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, targetRot.x));
                prevMouse = { x, y };
            };
            const onEnd = () => { isDragging = false; setTimeout(() => { autoRotate = true; }, 3000); };

            cvs.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
            cvs.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
            cvs.addEventListener('mouseup', onEnd);
            cvs.addEventListener('mouseleave', onEnd);
            cvs.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY));
            cvs.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY));
            cvs.addEventListener('touchend', onEnd);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = Date.now() * 0.001;

            if (autoRotate) targetRot.y += 0.0008;
            currentRot.x += (targetRot.x - currentRot.x) * 0.05;
            currentRot.y += (targetRot.y - currentRot.y) * 0.05;
            scene.rotation.x = currentRot.x;
            scene.rotation.y = currentRot.y;

            stars.forEach((s, i) => {
                if (s.userData.isMilestone) {
                    const scale = 1 + Math.sin(t * 1.5 + i) * 0.1;
                    if (s.children[0]) s.children[0].scale.set(scale, scale, scale);
                    if (s.children[1]) {
                        const g = 1 + Math.sin(t * 1.2 + i) * 0.15;
                        s.children[1].scale.set(g, g, g);
                        s.children[1].material.opacity = 0.2 + Math.sin(t * 2 + i) * 0.1;
                    }
                    if (s.children[2]) {
                        const g2 = 1 + Math.sin(t * 0.8 + i) * 0.12;
                        s.children[2].scale.set(g2, g2, g2);
                    }
                    if (s.userData.ring) {
                        s.userData.ring.rotation.z = t * 0.4;
                        s.userData.ring.material.opacity = 0.3 + Math.sin(t * 2 + i) * 0.15;
                    }
                    s.position.y = s.userData.baseY + Math.sin(t * 0.6 + i * 0.4) * 5;
                } else {
                    s.material.opacity = s.userData.baseOpacity + Math.sin(t * s.userData.speed * 20 + s.userData.offset) * 0.2;
                }
            });

            // 流星
            if (Math.random() < 0.003 && shootingStars.length < 2) {
                const x = (Math.random() - 0.5) * 500;
                const y = 200 + Math.random() * 100;
                const points = [];
                for (let i = 0; i < 12; i++) {
                    points.push(new THREE.Vector3(x + i * 12, y - i * 8, 0));
                }
                const ss = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints(points),
                    new THREE.LineBasicMaterial({ color: 0xffd700, transparent: true, opacity: 1 })
                );
                ss.userData = { life: 40, speed: 6 };
                shootingStars.push(ss);
                scene.add(ss);
            }
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                ss.position.x += ss.userData.speed;
                ss.position.y -= ss.userData.speed * 0.5;
                ss.userData.life--;
                ss.material.opacity = ss.userData.life / 40;
                if (ss.userData.life <= 0) {
                    scene.remove(ss);
                    shootingStars.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // 启动
        renderList();
        init3D();
    </script>
</body>
</html>
